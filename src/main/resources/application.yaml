jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  issuer: runna-api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/runna
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: runna
